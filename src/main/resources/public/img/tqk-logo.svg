  <text x="31" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#003366">Q</text>
  <text x="63" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#AE9966">K</text>
  <path d="M2 54 Q59 66 116 50" stroke="#AE9966" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
