<!-- TQK (TRUSTEQ-Krankenkasse) wordmark - a fictional insurer, generated
     for this demo rather than a real company's asset (contrast the SDK
     subsite's logo, which uses a real insurer's actual file - see
     docs/governance/trust-and-compliance.md). Colors are sampled directly
     from the real TRUSTEQ logo (../trusteq-logo.png, also used by the
     wallet/dashboard) - #003366 navy, #AE9966 gold - so this reads as
     "the same company's insurance arm," not an unrelated invented mark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 68">
