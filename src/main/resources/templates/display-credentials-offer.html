<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css"
          th:href="@{/public/css/main.css}">
    <!-- Blocking (no defer/async) and in <head>, ahead of <body>, so the
         is-embedded class it may set lands before the header below ever
         paints - see public/js/embed-detect.js. -->
    <script th:src="@{/public/js/embed-detect.js}"></script>
    <title th:text="#{eudiw} + ' :: ' + #{issue-credentials}">TRUSTEQ - EUDI Demo Wallet :: Issue Credentials</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <div class="container p-4">
        <div class="row mb-2">
            <div class="col">
                <h4 th:text="#{issue-credentials}">Issue Credentials</h4>
            </div>
        </div>
        <div class="row mb-2">
            <div class="col">
                <p th:text="#{scan-qr-code-to-issue-credentials} + ':'">
                    Scan the generated QR Code to issue the requested Credentials:
                </p>
            </div>
        </div>
        <div class="row mb-2">
            <div class="col d-flex justify-content-center align-content-center">
                <!--/*@thymesVar id="qrCode" type="kotlin.String"*/-->
                <!--/*@thymesVar id="qrCodeMediaType" type="kotlin.String"*/-->
                <img class="qr-code qr-zoom-target"
                     th:src="'data:' + ${qrCodeMediaType} + ';base64,' + ${qrCode}"
                     alt="QR Code"
                     th:alt="#{qr-code}"/>
            </div>
        </div>
        <!--/*@thymesVar id="uri" type="kotlin.String"*/-->
        <div class="row mb-2 p-2">
            <div class="col d-flex justify-content-center align-content-center">
                <p>
                    <span th:text="#{alternatively-you-can-click}">Alternatively, you can click this</span>
                    <a rel="noopener noreferrer"
                       target="_blank"
                       href="https://netcompany-intrasoft.com"
                       th:href="${uri}"
                       th:text="#{link}">Link</a>
                </p>
            </div>
        </div>
        <div class="row mb-2">
            <div class="col d-flex justify-content-center align-content-center">
                <details class="advanced-section link-reveal">
                    <summary th:text="#{or-copy-the-link-below}">Or copy the link below</summary>
                    <code class="credentials-offer-uri" th:text="${uri}">https://netcompany-intrasoft.com</code>
                </details>
            </div>
        </div>
        <div class="row">
            <div class="col d-flex justify-content-end align-content-center">
                <a class="btn btn-warning"
                   href=""
                   th:href="@{/issuer/credentialsOffer/generate}"
                   th:text="#{go-back}">Go Back</a>
            </div>
        </div>

        <!--/*@thymesVar id="openid4VciVersion" type="kotlin.String"*/-->
        <p class="compatibility-note" th:unless="${#strings.isEmpty(openid4VciVersion)}">
            <span th:text="#{compatible-with}">This issuer is compatible with</span>
            <a rel="noopener noreferrer" target="_blank"
               href="https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html"
               th:text="'OpenID4VCI ' + ${openid4VciVersion}">OpenID4VCI v1</a>
        </p>
    </div>
</main>
<script type="application/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.min.js}">
</script>
<script th:src="@{/public/js/qr-zoom.js}"></script>
</body>
</html>
