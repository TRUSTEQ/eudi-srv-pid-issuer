<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Shared header/footer chrome for the TQK/EHIC subsite (tqk-ehic-landing.html/
       tqk-ehic-offer.html) - the second, TRUSTEQ-branded parallel to the
       SDK subsite's own fragments/sdk-chrome.html, which this file mirrors
       structurally rule for rule. See public/css/tqk-theme.css's header
       comment for why the two subsites share structure but not a
       stylesheet. */-->
<div th:fragment="tqkHeader">
    <!--/* Same unmissable, full-width disclaimer bar as the SDK subsite's
           own .sdk-banner - here the claim is different (TRUSTEQ-Krankenkasse
           doesn't exist at all, rather than "not affiliated with a real
           company"), so the text differs but the mechanism doesn't. */-->
    <div class="tqk-banner">
        <span th:utext="#{tqk-ehic-demo-banner-html}">
            <strong>Demo</strong> - a fictional TRUSTEQ insurer.
        </span>
    </div>
    <div class="tqk-header-utility"></div>
    <header class="tqk-nav">
        <a th:href="@{/issuer/tqk/ehic}" class="tqk-brand">
            <img class="tqk-logo" th:src="@{/public/img/tqk-logo.svg}" alt=""/>
            <span class="tqk-brand-name" th:text="#{tqk-ehic-brand-name}">TRUSTEQ-Krankenkasse</span>
        </a>
    </header>
</div>

<!--/* The "story so far" strip - Identität -> Karte - same reasoning as the
       SDK subsite's own sdkSteps (only two steps, no way to know if/when a
       wallet elsewhere finishes fetching the credential). Uses the same
       neutral .step/.step-num/.step-label/.step--active classes as sdkSteps
       - both fragments feed the same shared public/js/identity-verify.js,
       which doesn't know or care which brand's page it's running on. */-->
<nav class="tqk-steps" th:fragment="tqkSteps(current)" aria-label="Fortschritt">
    <span class="step" data-step="1" th:classappend="${current == 1} ? ' step--active'">
        <span class="step-num">1</span>
        <span class="step-label" th:text="#{tqk-ehic-step1-label}">Identity</span>
    </span>
    <span class="step-sep" aria-hidden="true"></span>
    <span class="step" data-step="2" th:classappend="${current == 2} ? ' step--active'">
        <span class="step-num">2</span>
        <span class="step-label" th:text="#{tqk-ehic-step2-label}">Card</span>
    </span>
</nav>

<!--/* Same navy footer band structure as the SDK subsite's sdkFooter -
       icon row, version/legal-link strip, light/dark toggle - just TQK's
       own colors underneath. The toggle button shares the neutral
       #theme-toggle id with the SDK subsite (one shared light/dark
       preference, see public/js/theme-toggle.js); its class stays
       tqk-prefixed since that's only ever used for styling. */-->
<footer class="tqk-footer" th:fragment="tqkFooter">
    <div class="tqk-footer-band">
        <button type="button" class="tqk-theme-toggle" id="theme-toggle" th:attr="aria-label=#{tqk-ehic-toggle-theme-aria}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        </button>
        <ul class="tqk-footer-icons" aria-hidden="true">
            <li class="tqk-footer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M13.5 21v-7h2.2l.3-2.6h-2.5V9.7c0-.75.2-1.3 1.3-1.3h1.4V6.1C15.9 6 15 6 14 6c-2.1 0-3.5 1.3-3.5 3.6v2H8.3v2.6h2.2v7"/></svg>
                <span>Facebook</span>
            </li>
            <li class="tqk-footer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3.4"/><circle cx="16.3" cy="7.7" r=".6" fill="currentColor" stroke="none"/></svg>
                <span>Instagram</span>
            </li>
            <li class="tqk-footer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6.5" width="18" height="11" rx="3"/><path d="M10.5 9.5v5l4.3-2.5-4.3-2.5Z" fill="currentColor" stroke="none"/></svg>
                <span>Youtube</span>
            </li>
            <li class="tqk-footer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor" stroke="none"/><path d="M8 8l8 8M16 8l-8 8" stroke="var(--footer-bg)" stroke-width="2.2" stroke-linecap="round"/></svg>
                <span>Xing</span>
            </li>
            <li class="tqk-footer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.2" cy="8.3" r=".9" fill="currentColor" stroke="none"/><path d="M8.2 11v6M12 11v6M12 13.5c0-1.4 1-2.5 2.3-2.5S16.5 12 16.5 13.4V17"/></svg>
                <span>LinkedIn</span>
            </li>
        </ul>
        <div class="tqk-footer-legal">
            <span class="tqk-footer-build" th:text="#{tqk-ehic-footer-build}">Demo build</span>
            <nav class="tqk-footer-links" aria-hidden="true">
                <span th:text="#{tqk-ehic-footer-link-impressum}">Legal notice</span>
                <span th:text="#{tqk-ehic-footer-link-terms}">Terms of use</span>
                <span th:text="#{tqk-ehic-footer-link-privacy}">Privacy policy</span>
                <span th:text="#{tqk-ehic-footer-link-compliance}">Compliance</span>
            </nav>
        </div>
    </div>
    <p class="tqk-footer-disclaimer" th:text="#{tqk-ehic-footer-disclaimer}">
        EUDI Wallet demo - TRUSTEQ-Krankenkasse is a fictional health insurer.
    </p>
</footer>
</body>
</html>
