<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Shared header/footer chrome for the SDK/EHIC subsite (sdk-ehic-landing.html/
       sdk-ehic-offer.html).
       EXPERIMENT (branch: sdk-visual-consistency): the header below now
       mirrors eudi_web_login's own two-band structure (a plain gray
       utility strip, then a taller white band for the logo) instead of
       this subsite's previous single nav row - see public/css/sdk-theme.css's
       header comment for the rest of what changed on this branch and why. */-->
<div th:fragment="sdkHeader">
    <!--/* Same unmissable, full-width disclaimer bar as eudi_web_login's own
           .demo-banner (see that file's style.css) - same colors/border/
           layout, reused here rather than reinvented, since both apps are
           making the identical claim ("this is a demo, not SDK's real
           site"). No role/demo pill badges in the header below (dropped -
           the banner here already says it, a second/third marker was
           redundant) - just the brand mark, matching how plain the client
           site's own header is. */-->
    <div class="sdk-banner">
        <span th:utext="#{sdk-ehic-demo-banner-html}">
            <strong>Demo</strong> - not SDK's real site.
        </span>
    </div>
    <div class="sdk-header-utility"></div>
    <header class="sdk-nav">
        <a th:href="@{/issuer/sdk/ehic}" class="sdk-brand">
            <img class="sdk-logo" th:src="@{/public/img/sdk-logo.svg}" alt=""/>
            <span class="sdk-brand-name" th:text="#{sdk-ehic-brand-name}">Süddeutsche Krankenkasse</span>
        </a>
    </header>
</div>

<!--/* The "story so far" strip - Identität -> Karte - shown on both
       sdk-ehic-landing.html and sdk-ehic-offer.html so the whole subsite
       reads as one continuous narrative instead of two unrelated pages.
       `current` only sets the *initial* highlighted step from the server
       side; the landing page's own JS (sdk-verify.js) moves it from 1 to 2
       once the simulated identity check finishes, without a page reload -
       see that file. Deliberately only two steps, not three: this app has
       no way of knowing when (or whether) a wallet elsewhere actually
       finishes fetching the credential once the QR is scanned - there's no
       polling back to the issuer (same reasoning as sdk-ehic-offer.html's
       own comment about that) - so a third "saved to wallet" step would
       show as permanently unlit, promising a confirmation this page can
       never actually give. */-->
<nav class="sdk-steps" th:fragment="sdkSteps(current)" aria-label="Fortschritt">
    <span class="sdk-step" data-step="1" th:classappend="${current == 1} ? ' sdk-step--active'">
        <span class="sdk-step-num">1</span>
        <span class="sdk-step-label" th:text="#{sdk-ehic-step1-label}">Identity</span>
    </span>
    <span class="sdk-step-sep" aria-hidden="true"></span>
    <span class="sdk-step" data-step="2" th:classappend="${current == 2} ? ' sdk-step--active'">
        <span class="sdk-step-num">2</span>
        <span class="sdk-step-label" th:text="#{sdk-ehic-step2-label}">Card</span>
    </span>
</nav>

<footer class="sdk-footer" th:fragment="sdkFooter">
    <p th:text="#{sdk-ehic-footer-disclaimer}">
        EUDI Wallet demo - not affiliated with or endorsed by Süddeutsche Krankenkasse
    </p>
</footer>
</body>
</html>
