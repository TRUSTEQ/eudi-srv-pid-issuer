<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Shared header/footer chrome for the SDK/EHIC subsite (sdk-ehic-landing.html/
       sdk-ehic-offer.html).
       EXPERIMENT (branch: sdk-visual-consistency): the header below now
       mirrors eudi_web_login's own two-band structure (a plain gray
       utility strip, then a taller white band for the logo) instead of
       this subsite's previous single nav row - see public/css/sdk-theme.css's
       header comment for the rest of what changed on this branch and why. */-->
<div th:fragment="sdkHeader">
    <!--/* Same unmissable, full-width disclaimer bar as eudi_web_login's own
           .demo-banner (see that file's style.css) - same colors/border/
           layout, reused here rather than reinvented, since both apps are
           making the identical claim ("this is a demo, not SDK's real
           site"). No role/demo pill badges in the header below (dropped -
           the banner here already says it, a second/third marker was
           redundant) - just the brand mark, matching how plain the client
           site's own header is. */-->
    <div class="sdk-banner">
        <span th:utext="#{sdk-ehic-demo-banner-html}">
            <strong>Demo</strong> - not SDK's real site.
        </span>
    </div>
    <div class="sdk-header-utility"></div>
    <header class="sdk-nav">
        <a th:href="@{/issuer/sdk/ehic}" class="sdk-brand">
            <img class="sdk-logo" th:src="@{/public/img/sdk-logo.svg}" alt=""/>
            <span class="sdk-brand-name" th:text="#{sdk-ehic-brand-name}">Süddeutsche Krankenkasse</span>
        </a>
    </header>
</div>

<!--/* The "story so far" strip - Identität -> Karte - shown on both
       sdk-ehic-landing.html and sdk-ehic-offer.html so the whole subsite
       reads as one continuous narrative instead of two unrelated pages.
       `current` only sets the *initial* highlighted step from the server
       side; the landing page's own JS (sdk-verify.js) moves it from 1 to 2
       once the simulated identity check finishes, without a page reload -
       see that file. Deliberately only two steps, not three: this app has
       no way of knowing when (or whether) a wallet elsewhere actually
       finishes fetching the credential once the QR is scanned - there's no
       polling back to the issuer (same reasoning as sdk-ehic-offer.html's
       own comment about that) - so a third "saved to wallet" step would
       show as permanently unlit, promising a confirmation this page can
       never actually give. */-->
<nav class="sdk-steps" th:fragment="sdkSteps(current)" aria-label="Fortschritt">
    <span class="sdk-step" data-step="1" th:classappend="${current == 1} ? ' sdk-step--active'">
        <span class="sdk-step-num">1</span>
        <span class="sdk-step-label" th:text="#{sdk-ehic-step1-label}">Identity</span>
    </span>
    <span class="sdk-step-sep" aria-hidden="true"></span>
    <span class="sdk-step" data-step="2" th:classappend="${current == 2} ? ' sdk-step--active'">
        <span class="sdk-step-num">2</span>
        <span class="sdk-step-label" th:text="#{sdk-ehic-step2-label}">Card</span>
    </span>
</nav>

<!--/* The navy band below carries the same decorative icon row, version/
       legal-link strip, AND light/dark toggle as eudi_web_login's own
       .footer-band - see that app's views.py/style.css for the source of
       every icon/string/color reused here, and public/js/sdk-theme-toggle.js
       for the toggle's own logic. This subsite now has a real dark theme
       behind it (see sdk-theme.css's :root[data-theme="dark"] block) -
       every other rule in that file already reads its custom properties
       rather than a literal color, so that one block plus this toggle is
       the whole feature, not a second stylesheet. */-->
<footer class="sdk-footer" th:fragment="sdkFooter">
    <div class="sdk-footer-band">
        <button type="button" class="sdk-theme-toggle" id="sdk-theme-toggle" th:attr="aria-label=#{sdk-ehic-toggle-theme-aria}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        </button>
        <ul class="sdk-footer-icons" aria-hidden="true">
            <li class="sdk-footer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M13.5 21v-7h2.2l.3-2.6h-2.5V9.7c0-.75.2-1.3 1.3-1.3h1.4V6.1C15.9 6 15 6 14 6c-2.1 0-3.5 1.3-3.5 3.6v2H8.3v2.6h2.2v7"/></svg>
                <span>Facebook</span>
            </li>
            <li class="sdk-footer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3.4"/><circle cx="16.3" cy="7.7" r=".6" fill="currentColor" stroke="none"/></svg>
                <span>Instagram</span>
            </li>
            <li class="sdk-footer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6.5" width="18" height="11" rx="3"/><path d="M10.5 9.5v5l4.3-2.5-4.3-2.5Z" fill="currentColor" stroke="none"/></svg>
                <span>Youtube</span>
            </li>
            <li class="sdk-footer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor" stroke="none"/><path d="M8 8l8 8M16 8l-8 8" stroke="var(--footer-bg)" stroke-width="2.2" stroke-linecap="round"/></svg>
                <span>Xing</span>
            </li>
            <li class="sdk-footer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.2" cy="8.3" r=".9" fill="currentColor" stroke="none"/><path d="M8.2 11v6M12 11v6M12 13.5c0-1.4 1-2.5 2.3-2.5S16.5 12 16.5 13.4V17"/></svg>
                <span>LinkedIn</span>
            </li>
        </ul>
        <div class="sdk-footer-legal">
            <span class="sdk-footer-build" th:text="#{sdk-ehic-footer-build}">Demo build</span>
            <nav class="sdk-footer-links" aria-hidden="true">
                <span th:text="#{sdk-ehic-footer-link-impressum}">Legal notice</span>
                <span th:text="#{sdk-ehic-footer-link-terms}">Terms of use</span>
                <span th:text="#{sdk-ehic-footer-link-privacy}">Privacy policy</span>
                <span th:text="#{sdk-ehic-footer-link-compliance}">Compliance</span>
            </nav>
        </div>
    </div>
    <p class="sdk-footer-disclaimer" th:text="#{sdk-ehic-footer-disclaimer}">
        EUDI Wallet demo - not affiliated with or endorsed by Süddeutsche Krankenkasse
    </p>
</footer>
</body>
</html>
