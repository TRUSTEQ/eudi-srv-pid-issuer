# English text kept in parallel with messages.properties (the active/German
# bundle) for a future locale switch - same "one active locale, other one
# maintained" convention as the wallet/client apps' own i18n.py files.
#
# Deliberately named messages.en.properties (a dot, not an underscore)
# instead of the Spring-conventional messages_en.properties - confirmed on
# a real deploy that the latter actively breaks the "German is the always-
# resolved default" plan: Spring's ResourceBundleMessageSource treats
# messages_en.properties as a REAL, resolvable locale-specific bundle for
# locale "en", and this container's own JVM default locale resolves to
# "en" (with no Accept-Language header at all, e.g. from curl, or most
# browsers' own default) - so messages_en.properties would silently win
# over the German base bundle for the most common real request instead of
# the base bundle only ever being a fallback for other locales. This file
# is never queried by Spring's actual resource-bundle resolution (it never
# constructs a "messages.en" candidate name, only "messages_<tag>" ones) -
# purely a human-readable reference, not wired into the app at all.
