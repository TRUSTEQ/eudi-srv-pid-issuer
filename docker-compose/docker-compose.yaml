name: eudi-srv-pid-issuer

networks:
  default:
    driver: bridge

services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=pid_issuer
      - POSTGRES_USER=pid_issuer
      - POSTGRES_PASSWORD=pid_issuer
    volumes:
      - ./postgresql/schema:/docker-entrypoint-initdb.d:RO
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pid_issuer -d pid_issuer" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
      args:
        VERSION: ${KEYCLOAK_ABCA_EXTENSION_VERSION}
    # A published tag, not a local-only one - `docker compose up -d` pulls
    # this from GHCR when no local image with this exact tag exists yet
    # (Compose's own default: pull first, build from the `build:` block
    # above only if that pull fails - see ../../../push-images.sh and the
    # top-level README's GHCR section). `build.args.VERSION` above still
    # controls what actually gets built either way; only the tag name no
    # longer carries the version suffix, to match this demo's :latest-only
    # convention everywhere else.
    image: ghcr.io/leo-sus-teq/eudi-issuer-keycloak:latest
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
      - --features=dpop,passkeys
    environment:
      # "forwarded" (this demo's own default) = trust the RFC 7239
      # `Forwarded` header, which the outer gateway's haproxy sets and every
      # inner hop relays unchanged. Deploying this stack behind something
      # that instead sets the X-Forwarded-* family and never RFC 7239
      # Forwarded (confirmed live: Azure Container Apps' own ingress is
      # exactly this shape) needs KC_PROXY_HEADERS=xforwarded instead -
      # override it in that environment's own container config rather than
      # here, since Keycloak only trusts one family at a time and changing
      # the default here would break this demo's own local/self-signed/
      # provided/behind-proxy setup, which already relies on "forwarded".
      - KC_PROXY_HEADERS=${KC_PROXY_HEADERS:-forwarded}
      - KC_HTTP_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/idp
      - KC_HOSTNAME=${DEMO_SCHEME:-https}://${ISSUER_HOST:-issuer.localhost}/idp
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTPS_CERTIFICATE_FILE=/etc/ssl/certs/keycloak.tls.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/ssl/certs/keycloak.tls.key
      # Nothing calls Keycloak's :8443 listener anymore as of the
      # http://keycloak:8080 switch above (haproxy's keycloak-backend was
      # already plain :8080) - the two lines above are dead code today, same
      # as several haproxy TLS binds elsewhere in this demo. Kept enabled by
      # default so local `docker compose up -d` behavior is unchanged either
      # way; override to false in an environment with no bind-mounted
      # keycloak.tls.crt/key (e.g. Azure Container Apps) so Keycloak doesn't
      # try and fail to load a cert that was never provided there.
      - KC_HTTPS_ENABLED=${KC_HTTPS_ENABLED:-true}
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /idp/health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_interval: 30s
      start_period: 30s
    volumes:
      - ./keycloak/realms/:/opt/keycloak/data/import
      - ./keycloak/certs/:/etc/ssl/certs/
      - ./keycloak/conf/keycloak.conf:/opt/keycloak/conf/keycloak.conf
    networks:
      - default

  status-list:
    build:
      context: ./status-list
      dockerfile: Dockerfile
      args:
        VERSION: ${STATUS_LIST_VERSION}
    # See keycloak's own `image:` comment above - same reasoning, same
    # pull-then-build-as-fallback behavior, same tag-name simplification.
    image: ghcr.io/leo-sus-teq/eudi-issuer-status-list:latest
    container_name: status-list
    environment:
      API_key: aaa-bbb-ccc
    volumes:
      - ./status-list/config/config_service.py:/status-list/app/config_service.py
      - ./status-list/certs:/status-list/certs
      - status-lists:/var/opt/status_lists
      - status-lists-backups:/var/opt/status_list_backup
    networks:
      - default

  pid-issuer:
    # No `build:` block here - Compose itself can't build this (it's Spring
    # Boot's own Cloud Native Buildpacks integration, `./gradlew
    # bootBuildImage`, not a Dockerfile - see ../../build-images.sh). If
    # you've run that (or ../../Makefile's `make images`) it produces
    # "build/pid-issuer:latest" locally and re-tags it to the name below
    # (build.gradle.kts's own imageName setting is unrelated and unchanged -
    # see its own comment there for why it's "build/pid-issuer"). Otherwise,
    # `docker compose up -d` pulls this tag from GHCR - no `pull_policy:
    # never` override anymore, since "not built locally yet" is now the
    # normal, successful case (see ../../push-images.sh and the top-level
    # README's GHCR section), not something to hard-refuse.
    image: ghcr.io/leo-sus-teq/eudi-issuer-pidissuer:latest
    container_name: pid-issuer
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      status-list:
        condition: service_started
    volumes:
      - ./pid-issuer/issuer-keys.jks:/issuer-keys.jks
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxDirectMemorySize=64M
      - SPRING_PROFILES_ACTIVE=insecure
      - SPRING_WEBFLUX_BASE_PATH=/pid-issuer
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTID=pid-issuer-srv
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTSECRET=gnqZxLhmqvOkLVRq8DVWqSPvxYpBPCUf
      - SPRING_HTTP_CODECS_MAXINMEMORYSIZE=8MB
      # SameSite=None is only valid alongside Secure, which only works over
      # real HTTPS - demo-up.sh derives both of these from DEMO_TLS_MODE
      # (see its comments), so they're "none"/"true" whenever there's TLS
      # in front of this (the default, and what lets the issuer's CSRF-
      # protected UI survive being embedded in the dashboard's cross-site
      # iframe), and safely fall back to the browser's own default
      # (Lax, unpartitioned) when DEMO_TLS_MODE=none - embedding still
      # won't work without TLS (browsers require Secure for SameSite=None,
      # full stop), but standalone use of the issuer keeps working either
      # way, which forcing "none" unconditionally here would have broken.
      - SERVER_REACTIVE_SESSION_COOKIE_SAME_SITE=${SESSION_COOKIE_SAME_SITE:-none}
      - SERVER_REACTIVE_SESSION_COOKIE_PARTITIONED=${SESSION_COOKIE_PARTITIONED:-true}
      - ISSUER_PUBLICURL=${DEMO_SCHEME:-https}://${ISSUER_HOST:-issuer.localhost}/pid-issuer
      - ISSUER_AUTHORIZATIONSERVER_PUBLICURL=${DEMO_SCHEME:-https}://${ISSUER_HOST:-issuer.localhost}/idp/realms/pid-issuer-realm
      # Plain HTTP on Keycloak's :8080 (KC_HTTP_ENABLED=true), not the :8443
      # TLS listener - this is a same-docker-network hop entirely internal
      # to this stack, unrelated to the browser-facing scheme, so it doesn't
      # need to vary with DEMO_TLS_MODE. Using the plain port here means
      # Keycloak doesn't need its own TLS cert/listener at all in an
      # environment (e.g. Azure Container Apps) that has no bind-mounted
      # keycloak.tls.crt/key to give it.
      - ISSUER_AUTHORIZATIONSERVER_INTROSPECTION=http://keycloak:8080/idp/realms/pid-issuer-realm/protocol/openid-connect/token/introspect
      - ISSUER_KEYSTORE_FILE=file:/issuer-keys.jks
      - ISSUER_KEYSTORE_TYPE=JKS
      - ISSUER_KEYSTORE_PASSWORD=keys
      - ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_ALIAS=request-encryption
      - ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_PASSWORD=request-encryption
      - ISSUER_NONCE_ENCRYPTIONKEY_ALIAS=nonce-encryption
      - ISSUER_NONCE_ENCRYPTIONKEY_PASSWORD=nonce-encryption
      - ISSUER_PID_MSO_MDOC_SIGNING_KEY_ALIAS=issuance
      - ISSUER_PID_MSO_MDOC_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_PID_SD_JWT_VC_SIGNING_KEY_ALIAS=issuance
      - ISSUER_PID_SD_JWT_VC_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_MDL_SIGNING_KEY_ALIAS=issuance
      - ISSUER_MDL_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_LEARNINGCREDENTIAL_SIGNING_KEY_ALIAS=issuance
      - ISSUER_LEARNINGCREDENTIAL_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_EHIC_SIGNING_KEY_ALIAS=issuance
      - ISSUER_EHIC_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_RESIDENCEPERMIT_SIGNING_KEY_ALIAS=issuance
      - ISSUER_RESIDENCEPERMIT_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_SCHUFA_SD_JWT_VC_SIGNING_KEY_ALIAS=issuance
      - ISSUER_SCHUFA_SD_JWT_VC_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_SCHUFA_MSO_MDOC_SIGNING_KEY_ALIAS=issuance
      - ISSUER_SCHUFA_MSO_MDOC_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_ARBEITSVERTRAG_SD_JWT_VC_SIGNING_KEY_ALIAS=issuance
      - ISSUER_ARBEITSVERTRAG_SD_JWT_VC_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_ARBEITSVERTRAG_MSO_MDOC_SIGNING_KEY_ALIAS=issuance
      - ISSUER_ARBEITSVERTRAG_MSO_MDOC_SIGNING_KEY_PASSWORD=issuance
      - ISSUER_ACCESSCERTIFICATE_ALIAS=access-certificate
      - ISSUER_ACCESSCERTIFICATE_PASSWORD=access-certificate
      # See the ISSUER_AUTHORIZATIONSERVER_INTROSPECTION comment above - same
      # reasoning, same plain-:8080 port.
      - ISSUER_KEYCLOAK_SERVER_URL=http://keycloak:8080/idp
      - ISSUER_KEYCLOAK_AUTHENTICATION_REALM=master
      - ISSUER_KEYCLOAK_CLIENT_ID=admin-cli
      - ISSUER_KEYCLOAK_USERNAME=admin
      - ISSUER_KEYCLOAK_PASSWORD=password
      - ISSUER_KEYCLOAK_USER_REALM=pid-issuer-realm
      - ISSUER_DPOP_REALM=pid-issuer
      - SPRING_R2DBC_URL=r2dbc:pool:postgresql://postgres:5432/pid_issuer
      - SPRING_R2DBC_USERNAME=pid_issuer
      - SPRING_R2DBC_PASSWORD=pid_issuer
      - ISSUER_STATUSLIST_SERVICE_GENERATE_URI=http://status-list:5000/token_status_list/take
      - ISSUER_STATUSLIST_SERVICE_REVOKE_URI=http://status-list:5000/token_status_list/take
      - ISSUER_STATUSLIST_SERVICE_APIKEY=aaa-bbb-ccc
      - ISSUER_METADATA_DISPLAY_0_NAME=TRUSTEQ - EUDI Demo Wallet
      - ISSUER_METADATA_DISPLAY_0_LOCALE=en
      - ISSUER_METADATA_DISPLAY_0_LOGO_URI=${DEMO_SCHEME:-https}://${ISSUER_HOST:-issuer.localhost}/pid-issuer/public/img/trusteq-logo.png
      # CSP frame-ancestors' one legitimate framer - see ConfigureSecurity.kt
      # and application.properties' issuer.ui.dashboardOrigin default.
      - ISSUER_UI_DASHBOARDORIGIN=${DEMO_SCHEME:-https}://${DASHBOARD_HOST:-demo.localhost}
      # The demo-wide SDK/neutral narrative toggle (see demo.env.example and
      # DemoBrandProperties) - passed through under its own Spring-relaxed-binding
      # name since DEMO_BRAND itself isn't shaped like a `demo.brand.*` property.
      - DEMO_BRAND_MODE=${DEMO_BRAND:-sdk}
      - ISSUER_METADATA_DISPLAY_0_LOGO_ALTERNATIVE_TEXT=TRUSTEQ - EUDI Demo Wallet Logo
      - ISSUER_PREAUTHORIZEDCODE_DEMOUSERNAME=tneal
      - ISSUER_PREAUTHORIZEDCODE_EXPIRATION=PT10M
      - ISSUER_SELFISSUEDACCESSTOKEN_EXPIRATION=PT30M
      # Same demo Wallet-Relying-Party Registration Certificate already used by the
      # (inactive here) develop profile - see application-develop.properties. Required
      # since CredentialIssuerMetaData now reads issuer.wrprc unconditionally.
      - ISSUER_..h3wtRbSVXVGJVblxwHLQQivFN-iQiyyIGLmbFoNHpC8GRcKjuseUhbatzS-PGh7eDBPOCwh0VSgotEtjTiYKzA
      # Local demo only: the reference demo wallet is software-only and cannot produce a
      # real hardware key attestation. Production deployments should leave this at the
      # default (true, see application.properties).
      - ISSUER_PID_MSO_MDOC_DEVICEBINDING_REQUIREKEYATTESTATION=false
      - ISSUER_PID_SD_JWT_VC_DEVICEBINDING_REQUIREKEYATTESTATION=false
      - ISSUER_LEARNINGCREDENTIAL_DEVICEBINDING_REQUIREKEYATTESTATION=false
      - ISSUER_EHIC_DEVICEBINDING_REQUIREKEYATTESTATION=false
      - ISSUER_RESIDENCEPERMIT_DEVICEBINDING_REQUIREKEYATTESTATION=false
      - ISSUER_SCHUFA_SD_JWT_VC_DEVICEBINDING_REQUIREKEYATTESTATION=false
      - ISSUER_SCHUFA_MSO_MDOC_DEVICEBINDING_REQUIREKEYATTESTATION=false
      - ISSUER_ARBEITSVERTRAG_SD_JWT_VC_DEVICEBINDING_REQUIREKEYATTESTATION=false
      - ISSUER_ARBEITSVERTRAG_MSO_MDOC_DEVICEBINDING_REQUIREKEYATTESTATION=false
    networks:
      - default

  haproxy:
    image: haproxy:2.8.3
    container_name: haproxy
    # No host ports published: the demo gateway (../../eudi-gateway) is the
    # sole entry point now, reaching this on the docker network as
    # ${DEMO_SCHEME:-https}://${ISSUER_HOST:-issuer.localhost}.
    depends_on:
      keycloak:
        condition: service_healthy
      pid-issuer:
        condition: service_started
      status-list:
        condition: service_started
    volumes:
      - ./haproxy/haproxy.conf:/usr/local/etc/haproxy/haproxy.cfg
      - ./haproxy/certs/:/etc/ssl/certs/
    # Read by haproxy.conf's pid-issuer-metadata backend - `${VAR:-default}`
    # here (not a bare passthrough) so this stack's own metadata endpoint
    # still resolves to a real URL even when run standalone, without
    # demo-up.sh ever exporting anything (see this project's own README).
    environment:
      - DEMO_SCHEME=${DEMO_SCHEME:-https}
      - ISSUER_HOST=${ISSUER_HOST:-issuer.localhost}
      # Bare passthrough, no default - see ../../../eudi-gateway/docker-compose.yaml's
      # comment on DEMO_TLS_DISABLED for why it must be truly absent (not
      # set-to-empty) when unset. Controls haproxy.conf's own `.if
      # defined(DEMO_TLS_DISABLED)` around this stack's :443 bind.
      - DEMO_TLS_DISABLED
    networks:
      - default

volumes:
  status-lists:
  status-lists-backups:
  postgres:
