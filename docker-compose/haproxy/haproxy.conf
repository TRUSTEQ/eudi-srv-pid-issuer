global
    maxconn 50000
    log stdout format raw local0
    user root
    group root
    nbthread 4
    cpu-map auto:1/1-4 0-3
    ssl-default-bind-options ssl-min-ver TLSv1.1

defaults
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log global
    mode http
    option httplog
    maxconn 3000
    default_backend no-match

frontend all
    bind 0.0.0.0:80
.if defined(DEMO_TLS_DISABLED)
    # DEMO_TLS_DISABLED is only ever explicitly set (by demo-up.sh, when
    # DEMO_TLS_MODE=none/behind-proxy, or by an Azure Container Apps
    # deployment where this haproxy is only ever reached over plain HTTP
    # from Container Apps' own ingress one hop earlier) - absent by default,
    # so this bind stays exactly as it always has for anyone running
    # `docker compose up -d` directly without demo-up.sh. See the outer
    # gateway's own haproxy.conf (../../../eudi-gateway) for the same
    # pattern, and why it matters: without this, haproxy refuses to start
    # at all in an environment that never provisions
    # /etc/ssl/certs/localhost.tls.pem (this cert is genuinely never reached
    # today anyway - see the comment on backend keycloak-backend below).
.else
    bind 0.0.0.0:443 ssl crt /etc/ssl/certs/localhost.tls.pem
.endif
    # Bare root used to get a hardcoded redirect straight to the credential
    # offer form here (this stack has no page of its own at the HAProxy
    # level) - removed now that IssuerUi.kt's own root handler picks the
    # right target itself (the SDK/EHIC subsite or the generic form,
    # depending on DEMO_BRAND): that redirect ran here, in HAProxy, with no
    # visibility into DEMO_BRAND at all, so it silently overrode the app's
    # own branch every single time regardless of which one demo-up.sh had
    # configured - https://issuer.localhost/ (no /pid-issuer/ prefix) never
    # even reached the application. Routing bare "/" to the same backend as
    # everything else lets the app's own root handler decide, exactly like
    # https://issuer.localhost/pid-issuer/ already correctly did.
    use_backend pid-issuer-backend if { path / }
    use_backend keycloak-backend if { path_beg /idp }
    use_backend keycloak-backend if { path_beg /.well-known/oauth-authorization-server/idp/realms/pid-issuer-realm }
    use_backend keycloak-backend if { path_beg /.well-known/openid-configuration/idp/realms/pid-issuer-realm }
    use_backend pid-issuer-backend if { path_beg /.well-known/openid-credential-issuer/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /.well-known/oauth-protected-resource/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /.well-known/jwt-vc-issuer/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /.well-known/oauth-authorization-server/pid-issuer }
    use_backend pid-issuer-metadata if { path /.well-known/jwt-issuer/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /pid-issuer }
    use_backend status-list-backend if { path_beg /token_status_list }

backend keycloak-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    # No own `option forwarded` here (or on pid-issuer-backend/
    # status-list-backend below) - the gateway (../../../../eudi-gateway)
    # already set a correct Forwarded header one hop earlier, declaring
    # the real browser-facing scheme (which may well be https even though
    # this hop, gateway -> here, is always plain HTTP regardless of
    # DEMO_TLS_MODE) - relaying it unchanged is both simpler and more
    # correct than each hop recomputing its own from ssl_fc (which would
    # only ever describe *this* internal hop, never the browser's actual
    # connection - see the gateway's own haproxy.conf comment for the
    # full reasoning). Keycloak specifically relies on this via its own
    # KC_PROXY_HEADERS=forwarded setting (see docker-compose.yaml).
    http-request set-path /idp/realms/pid-issuer-realm/.well-known/oauth-authorization-server if { path_beg /.well-known/oauth-authorization-server/idp/realms/pid-issuer-realm }
    http-request set-path /idp/realms/pid-issuer-realm/.well-known/openid-configuration if { path_beg /.well-known/openid-configuration/idp/realms/pid-issuer-realm }
    server server1 keycloak:8080 cookie server1

backend pid-issuer-metadata
    # ${DEMO_SCHEME}/${ISSUER_HOST} come from the environment (see
    # ../../../../demo.env.example and demo-up.sh) - default to this demo's
    # original https://issuer.localhost when unset. This previously
    # hardcoded a bare "https://localhost/pid-issuer" (missing the
    # "issuer." subdomain entirely) regardless of domain - a pre-existing
    # bug, fixed here along with making it configurable.
    http-request return status 200 content-type application/json lf-string "{\"issuer\":\"${DEMO_SCHEME}://${ISSUER_HOST}/pid-issuer\",\"jwks_uri\":\"${DEMO_SCHEME}://${ISSUER_HOST}/pid-issuer/public_keys.jwks\"}"

backend pid-issuer-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    # Bare "/" (see the frontend's own use_backend rule above) needs the
    # same /pid-issuer prefix added as every other path here - the app's
    # own base-path (SPRING_WEBFLUX_BASE_PATH) only recognizes requests
    # that already carry it; forwarding an un-rewritten "/" 404s instead of
    # reaching IssuerUi.kt's root handler at all.
    http-request set-path /pid-issuer/ if { path / }
    http-request set-path /pid-issuer/.well-known/openid-credential-issuer if { path_beg /.well-known/openid-credential-issuer/pid-issuer }
    http-request set-path /pid-issuer/.well-known/oauth-protected-resource if { path_beg /.well-known/oauth-protected-resource/pid-issuer }
    http-request set-path /pid-issuer/.well-known/jwt-vc-issuer if { path_beg /.well-known/jwt-vc-issuer/pid-issuer }
    http-request set-path /pid-issuer/.well-known/oauth-authorization-server if { path_beg /.well-known/oauth-authorization-server/pid-issuer }
    server server1 pid-issuer:8080 cookie server1

backend status-list-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    server server1 status-list:5000 cookie server1

backend no-match
    http-request deny deny_status 404
